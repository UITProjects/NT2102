[project]
name = "auditship"
version = "0.1.0"
description = "Linux auditd -> Loki shipper for the OCR-APT lab (ubuntu-etw endpoint, DEVIATIONS D11)"
readme = "README.md"
requires-python = ">=3.12"
# Stdlib only, plus the lab's own Loki client (etwcollect.loki: urllib + gzip, no Windows imports), so the
# push contract and the retry rules are shared with the Windows collector, not copied.
dependencies = ["etwcollect"]

# `auditship run | status | selftest` (src/auditship/cli.py)
[project.scripts]
auditship = "auditship.cli:main"

[tool.uv.sources]
etwcollect = { path = "../etw-python" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auditship"]

[tool.uv]
package = true
