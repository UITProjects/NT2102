# =============================================================================
# OCR-APT reproduction — GraphDB reference environment (NT2102)
#
# Start:        docker compose up -d
# Init log:     docker compose logs -f graphdb-init   (ends with "[init] Done.")
# Workbench:    http://10.21.3.10:7200   user: admin   pass: Nt2102-OcrApt!
# Override:     GRAPHDB_ADMIN_PASSWORD=xxx GRAPHDB_HEAP=16g docker compose up -d
# Import data:  docker cp cadets.ttl ocrapt-graphdb:/opt/graphdb/import/
#               then Workbench -> Import -> Server files
# Network:      nt2102-net 10.21.3.0/24  gw .1 | graphdb 10.21.3.10 | init 10.21.3.11
#               (reserve .20+ for the PyG/LLM containers)
# From other containers on nt2102-net: http://graphdb:7200  or  http://10.21.3.10:7200
# Stop:         docker compose down        (keeps data)
# Wipe all:     docker compose down -v     (deletes repositories + users)
#
# Notes: password is set BEFORE security is enabled (otherwise admin is locked out).
#        Init job is idempotent. Avoid " and \ in the password (embedded in JSON).
#        GraphDB version not stated in the paper (§7.2.2) -> log in DEVIATIONS.
# =============================================================================
name: ocr-apt

x-admin-password: &admin_password ${GRAPHDB_ADMIN_PASSWORD:-Nt2102-OcrApt!}

services:
  graphdb:
    image: ontotext/graphdb:${GRAPHDB_VERSION:-10.8.0}
    container_name: ocrapt-graphdb
    restart: unless-stopped
    environment:
      GDB_JAVA_OPTS: >-
        -Xms${GRAPHDB_HEAP:-8g} -Xmx${GRAPHDB_HEAP:-8g}
        -Dgraphdb.home=/opt/graphdb/home
        -Dgraphdb.workbench.importDirectory=/opt/graphdb/import
    expose:
      - 7200
    volumes:
      - graphdb-home:/opt/graphdb/home
      - graphdb-import:/opt/graphdb/import
    mem_limit: ${GRAPHDB_MEM_LIMIT:-4g}
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    networks:
      nt2102:
        ipv4_address: 10.21.3.10

  graphdb-init:
    image: curlimages/curl:8.10.1
    container_name: ocrapt-graphdb-init
    depends_on: [graphdb]
    restart: "no"
    networks:
      nt2102:
        ipv4_address: 10.21.3.11
    environment:
      GDB_URL: http://graphdb:7200
      PW: *admin_password
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        code() { curl -s -o /dev/null -w '%{http_code}' "$$@" || echo 000; }

        echo "[init] waiting for GraphDB at $$GDB_URL ..."
        n=0
        while :; do
          c=$$(code "$$GDB_URL/protocol")
          if [ "$$c" = 200 ] || [ "$$c" = 401 ]; then break; fi
          n=$$((n + 1)); [ "$$n" -ge 90 ] && { echo "[init] timeout (last: $$c)"; exit 1; }
          sleep 2
        done

        if [ "$$(curl -s "$$GDB_URL/rest/security")" = "true" ]; then
          c=$$(code -u "admin:$$PW" "$$GDB_URL/rest/security/users/admin")
          [ "$$c" = 200 ] && { echo "[init] Done. Security already on, credentials valid."; exit 0; }
          echo "[init] Security on but admin login failed (HTTP $$c)."; exit 1
        fi

        echo "[init] Setting admin password ..."
        c=$$(code -X PUT "$$GDB_URL/rest/security/users/admin" -H 'Content-Type: application/json' \
          -d "{\"username\":\"admin\",\"password\":\"$$PW\",\"grantedAuthorities\":[\"ROLE_ADMIN\",\"ROLE_USER\"],\"appSettings\":{\"DEFAULT_INFERENCE\":true,\"DEFAULT_SAMEAS\":true,\"EXECUTE_COUNT\":true,\"IGNORE_SHARED_QUERIES\":false,\"DEFAULT_VIS_GRAPH_SCHEMA\":true}}")
        case "$$c" in 2*) ;; *) echo "[init] set password failed (HTTP $$c)"; exit 1;; esac

        echo "[init] Enabling security ..."
        c=$$(code -X POST "$$GDB_URL/rest/security" -H 'Content-Type: application/json' -d 'true')
        case "$$c" in 2*) ;; *) echo "[init] enable security failed (HTTP $$c)"; exit 1;; esac

        c=$$(code -u "admin:$$PW" "$$GDB_URL/rest/security/users/admin")
        [ "$$c" = 200 ] && echo "[init] Done." || { echo "[init] verify failed (HTTP $$c)"; exit 1; }

networks:
  nt2102:
    name: nt2102-net
    driver: bridge
    ipam:
      config:
        - subnet: 10.21.3.0/24
          ip_range: 10.21.3.128/25
          gateway: 10.21.3.1

volumes:
  graphdb-home:
    name: ocrapt-graphdb-home
  graphdb-import:
    name: ocrapt-graphdb-import