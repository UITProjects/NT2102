[project]
name = "etwcollect"
version = "0.1.0"
description = "ETW collector for the OCR-APT lab: Kernel-Process/File/Network -> SilkETW-format JSON lines -> Loki"
readme = "README.md"
requires-python = ">=3.12"
# No runtime dependencies on purpose: the ETW calls are ctypes, the Loki push is urllib (DEVIATIONS D10).
dependencies = []

# `etwcollect run | stop | status | dosmap | push-ledger | selftest` (src/etwcollect/cli.py)
[project.scripts]
etwcollect = "etwcollect.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etwcollect"]

[tool.uv]
package = true
