---
# Linux detection target VM (migration in progress): DVWA on native LAMP + Sysmon-for-Linux + Alloy.
# A SEPARATE host from ubuntu-trainer so the clean trainer stays out of the attack blast radius.
# Everything is gated by linux_target_enabled, so with the flag off this playbook is a no-op and the
# Windows demo is untouched:
#   ansible-playbook site.yml -e linux_target_enabled=true          # (or --limit target)
- name: Configure the Linux detection target VM
  hosts: target
  become: true
  gather_facts: true
  roles:
    - role: ubuntu_base       # apt deps, uv, timezone (reused from the trainer)
      when: linux_target_enabled | bool
    - role: ubuntu_vulnlab    # DVWA on native LAMP (apache2 + php + mariadb)
      when: linux_target_enabled | bool
    - role: ubuntu_collector  # Sysmon-for-Linux + Alloy -> Loki (same label scheme as SilkETW)
      when: linux_target_enabled | bool
