- name: Forward TCP 2102 on pve-master to nt2102-vpn:1194
  hosts: pve
  become: true
  gather_facts: false
  vars:
    vpn_ip: "{{ hostvars['nt2102-vpn'].private_ip }}"

  tasks:
    - name: Install netfilter-persistent
      ansible.builtin.apt:
        name: iptables-persistent
        state: present

    # The iptables module matches a rule on every field, the comment included. The rule was first created with a
    # wrong "/udp" comment; remove that copy, or fixing the comment would leave two DNAT rules. No-op once gone.
    - name: Remove the old DNAT rule with the wrong "/udp" comment
      ansible.builtin.iptables:
        table: nat
        chain: PREROUTING
        in_interface: "{{ wan_iface }}"
        protocol: tcp
        destination_port: "2102"
        jump: DNAT
        to_destination: "{{ vpn_ip }}:1194"
        state: absent
        comment: "it2102: DNAT OpenVPN: ext 2102/udp -> {{ vpn_ip }}:1194"
      register: vpn_dnat_old

    - name: DNAT external port 2102 to OpenVPN server ({{ vpn_ip }}:1194 TCP)
      ansible.builtin.iptables:
        table: nat
        chain: PREROUTING
        in_interface: "{{ wan_iface }}"
        protocol: tcp
        destination_port: "2102"
        jump: DNAT
        to_destination: "{{ vpn_ip }}:1194"
        action: insert
        rule_num: "1"
        state: present
        comment: "it2102: DNAT OpenVPN: ext 2102/tcp -> {{ vpn_ip }}:1194"
      register: vpn_dnat

    - name: Save iptables rules persistently
      ansible.builtin.command: netfilter-persistent save
      when: vpn_dnat.changed or vpn_dnat_old.changed
      changed_when: true
