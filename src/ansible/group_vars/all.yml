---
# Shared, address-agnostic configuration. No IP literals live here — the data-plane target is derived
# from the inventory's private_ip so moving to the cloud is just editing the inventory.

# Repo layout: playbook_dir is src/ansible, so src_dir is src/ (holds pipeline/, live/, scripts/).
src_dir: "{{ playbook_dir }}/.."

# ---- data-plane (Windows shipper -> Ubuntu live server) -------------------------------------------
# The trainer address the shipper POSTs to. Defaults to the Ubuntu host's subnet IP from the inventory;
# override in host_vars/group_vars on a cloud where the VMs reach each other on a different address.
trainer_host: "{{ hostvars['ubuntu-trainer'].private_ip }}"
server_port: 8000
# The Ubuntu server binds all interfaces so it listens on the subnet IP whatever it is.
server_bind: "0.0.0.0"

# ---- log pipeline: etwcollect (Windows) -> Loki + Grafana (Docker, host network, on the trainer) -------
# etwcollect pushes to loki_url; the live server and loki_pull.py read Loki on the trainer itself (127.0.0.1).
loki_port: 3100
grafana_port: 3000            # on the Ubuntu host (vulnlab's 3000 is on the Windows host: no clash)
loki_url: "http://{{ trainer_host }}:{{ loki_port }}"
loki_retention: "2160h"       # 90 d (user, 2026-11-09; was 72h): how long raw ETW stays queryable, also the max age Loki
                              # accepts. Loki stores ~445 MB per 3 days for both VMs (compressed), so ~15 GB at 90 d.
loki_image: "grafana/loki:3.7.8"
grafana_image: "grafana/grafana:13.2.2"
loki_stack_dir: "/opt/lokistack"
# Trainer resource monitoring (ubuntu_monitoring role): own compose project, so a change here never restarts Loki.
# All three listen on 127.0.0.1 only (no ufw rule); Grafana reads Prometheus and shows the "Trainer resources" dashboard.
prometheus_image: "prom/prometheus:v3.15.1"
node_exporter_image: "prom/node-exporter:v1.12.1"
cadvisor_image: "ghcr.io/google/cadvisor:v0.60.6"   # gcr.io stopped at older tags
monitoring_stack_dir: "/opt/monitoring"
prometheus_port: 9090
node_exporter_port: 9100
cadvisor_port: 8088           # cAdvisor defaults to 8080; moved off that common port
prometheus_scrape_interval: "15s"
prometheus_retention_time: "15d"
prometheus_retention_size: "2GB"
# Resources kept for monitoring, so a training run cannot take them (ubuntu_monitoring role, README "Trainer monitoring").
# reservation = RAM the kernel will not reclaim from it (memory.low), limit = the most it may ever use.
monitoring_mem:
  prometheus:    { reservation: 256, limit: 1024 }   # MiB
  cadvisor:      { reservation: 64,  limit: 256 }
  node_exporter: { reservation: 32,  limit: 128 }
  grafana:       { reservation: 512, limit: 1024 }
monitoring_cpu_shares: 8192   # Docker's 1024 maps BELOW an unset service's weight; this one maps well above it
monitoring_oom_score_adj: -500   # killed last; ocr-live is +500 (it restarts cleanly)
# Cap on everything run over SSH, training included. A share of real RAM, so it follows a VM resize after an Ansible
# re-run. 2026-11-07: a 3-day training run peaked at 2,524 MiB (1 seed, 3 epochs); 50 % of 12 GB is about 2.3x that.
training_memory_high: "{{ (ansible_memtotal_mb * 0.45) | int }}"   # MiB: slowed down and pushed to swap from here
training_memory_max: "{{ (ansible_memtotal_mb * 0.50) | int }}"    # MiB: RAM it can never pass
training_swap_max_gib: 40     # of swap_size_gib: a runaway job cannot take all of it from the live server
training_cpu_quota: "{{ (ansible_processor_vcpus - 1) * 100 }}%"   # one core always stays free
# Swap on the trainer (user, 2026-11-07: at least 50 GB). Monitoring containers are kept out of it (memswap_limit).
swap_size_gib: 50
swap_file: /swapfile
vm_swappiness: 10             # prefer dropping page cache; swap is the safety net, not working memory
# Inventory supplies: admin_cidr (who may open Grafana, e.g. your workstation), grafana_admin_password
# (local inventory for the lab; vault for cloud). Loki itself only accepts the Windows host's private_ip.

# ---- lab clock ------------------------------------------------------------------------------------
# Both VMs run on UTC+7. Safe for the pipeline: every TimeStamp carries its offset (etwcollect writes UTC)
# (e.g. "...+07:00"), labels/ledger/window IDs use UTC explicitly, so epoch ms do not depend on the zone.
tz_windows: "SE Asia Standard Time"   # Windows ID: (UTC+07:00) Bangkok, Hanoi, Jakarta
tz_linux: "Asia/Ho_Chi_Minh"          # IANA name, UTC+7, no DST

# ---- DVWA vulnlab (XAMPP + Damn Vulnerable Web Application, defensive detection target) ------------
vulnlab_enabled: false       # optional demo target; it may already run elsewhere (e.g. a teammate's cloud VM)
vulnlab_port: 3000           # XAMPP Apache listens here (same port on a different host from Grafana's 3000)
vulnlab_repo: "https://github.com/digininja/DVWA.git"
vulnlab_dir: 'C:\lab\DVWA'   # served at the Apache DocumentRoot, so the exploit path is /vulnerabilities/exec/
xampp_package: "xampp-81"    # Chocolatey package: Apache + PHP 8.1 + MariaDB bundle
dvwa_db_name: "dvwa"         # DVWA schema; created at provision time (DVWA builds tables via setup.php)
dvwa_db_user: "dvwa"         # DVWA on MariaDB needs a dedicated app user (its README); NOT root
dvwa_db_password: "p@ssw0rd" # lab-only DB password on a host-only network; DVWA's documented default
# The Kali attacker (exploit + RCE kill chain) is provisioned by Ansible (kali.yml, role kali_attack);
# its vars live in that role's defaults, not here.

# ---- pinned tool versions -------------------------------------------------------------------------
python_embed_version: "3.12.7"
python_embed_url: "https://www.python.org/ftp/python/{{ python_embed_version }}/python-{{ python_embed_version }}-embed-amd64.zip"
python_embed_sha256: "sha256:0d57bb6cb078b74d23dbfe91f77d6780d45bed328911609f1f7ee2ba1606bf44"

# uv (Windows): builds the etw-python collector's venv and downloads its CPython (uv-managed, not the embed zip).
uv_version: "0.9.3"
uv_url: "https://github.com/astral-sh/uv/releases/download/{{ uv_version }}/uv-x86_64-pc-windows-msvc.zip"
uv_sha256: "sha256:9f7595313b44e57dcaeef63fe4f3de9a0cf4f92a53302b429341f457f70ca3b9"   # release .sha256 file


# ---- Windows lab paths ----------------------------------------------------------------------------
graph_name: "SimulatedW10"   # the repo asserts the host name against a fixed list; keep this name
tools_dir: 'C:\Tools'
lab_home: 'C:\ProgramData\etwlab'
out_dir: 'C:\lab-out\etw'
raw_root: 'C:\lab-out\etw\raw'

# ---- ETW collector: our own Python collector (src/etw-python, DEVIATIONS D10) --------------------------
collector_task: "etwlab-collector"     # SYSTEM scheduled task that runs `python -m etwcollect run`
collector_session: "etwlab-collector"  # its ETW session name (etwcollect stop stops it by this name)
# Where the collector source comes from: a git clone of repo_url@repo_branch to etwpy_clone_dir.
# etwpy_clone_dir is deliberately NOT a var the role branches on (this file outranks the inventory's
# [windows:vars]); win_collector always clones.
etwpy_clone_dir: 'C:\lab\NT2102'
uv_dir: 'C:\Tools\uv'                   # uv.exe, its cache and the CPython it downloads
etwpy_venv: 'C:\Tools\etw-python-venv'  # on the VM's own disk, separate from the git clone
etwpy_python: "{{ etwpy_venv }}\\Scripts\\python.exe"

# ---- always-on live capture (win_shipper: C:\scripts\start-live.ps1 run by a SYSTEM scheduled task) ----
live_task_name: "etwlab-live"     # at boot + every live_watchdog_minutes: keep a test/live-<UTC> run capturing
live_watchdog_minutes: 5
live_rotate_hours: 6              # a new live run (= a new session in the UI) after this many hours
live_keep_days: 1                 # raw test/live-* runs with no write for this long are deleted on the VM

# ---- Ubuntu trainer -------------------------------------------------------------------------------
repo_url: "https://github.com/UITProjects/NT2102.git"
repo_branch: "main"
repo_dest: "/home/{{ ansible_user }}/NT2102"
# The model ocr-live loads is NOT set here: it is the repo's pointer src/artifacts/current.json, or
# current.local.json on the trainer (`lab promote <run>`). No run_id / experiment_id to keep in sync.
# live_llm_args: extra live_server.py LLM flags for ocr-live; unset/empty = LLM off. Non-empty also installs
# the `llm` uv group. Deliberately NOT defined in this file: group_vars/all.yml outranks the inventory's
# [ubuntu:vars], so a default here would silently override inventory.local.ini. Uses say `| default('')`.
# The API key is NEVER set here: save it once on the trainer (alg2.py --ping prompts, src/live/README.md §5).
# live_loki_host: the host ocr-live follows while the pointer has no per-host models (--loki-default-host; `lab hosts`
# wins once used); unset = newest run of any host. Same rule, set in
# the inventory's [ubuntu:vars], not here.
# live_sg_moderate_from: SG-Det cut-off for ocr-live (Moderate from this subgraph score). Same rule, not defined
# here; the unit template defaults it to 10 = [PAPER] §7.2.1 (user, 2026-11-03); 30 = the old [OURS] live scale.
# Live sessions keep their window results (windows/, windows.csv, sessions/history.jsonl) forever: that is the
# queryable history. Only the bulky raw copy (<session>/raw/, ~2 GB/h measured under load) is deleted hourly once
# nothing in it changed for this many hours (replay-* folders and any session holding a .keep file are skipped).
live_raw_keep_hours: 12
