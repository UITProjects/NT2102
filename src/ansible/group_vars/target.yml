---
# SSH connection for the Linux detection target. Same scheme as group_vars/ubuntu.yml: ansible_user / key
# come from the inventory. Nothing secret here.
ansible_connection: ssh
ansible_python_interpreter: /usr/bin/python3

# ---- auditd -> auditship -> Loki (roles linux_auditd, linux_auditship; DEVIATIONS D11) ----------------
auditship_user: auditship
auditship_state_dir: /var/lib/auditship
auditship_code_dir: /opt/auditship
auditd_conf:
  log_group: "{{ auditship_user }}"   # audit.log = 0640 root:auditship
  max_log_file: 50                    # MB per file
  num_logs: 5                         # audit.log + .1 .. .4 kept (rotation is followed by inode)
  max_log_file_action: ROTATE
auditd_watch_dirs: [/etc, /home, /root, /tmp, /var/tmp, /usr/local/bin, /opt]
