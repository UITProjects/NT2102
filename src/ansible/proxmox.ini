# Proxmox lab (infrastructure/ Terraform): the VMs on the SDN VNet it2102, 10.21.3.0/24.
# The workstation reaches the subnet directly over a routed path (home router -> pve-master), so
# ansible_host = private_ip. Committed to a public repo: NO secrets here.
#   Windows creds (win_user/win_password): group_vars/vault.yml (gitignored). Ubuntu needs no vault.
#   Run (Ubuntu FIRST: etwcollect needs Loki to push to):
#     ansible-playbook -i proxmox.ini ubuntu.yml
#     ansible-playbook -i proxmox.ini windows.yml -e @group_vars/vault.yml --ask-vault-pass -e vulnlab_enabled=true
#     ansible-playbook -i proxmox.ini target.yml          (Linux endpoint; after ubuntu.yml --tags loki)
# One-time on a fresh ws-etw (RDP, admin PowerShell) so WinRM accepts a routed source: README "Proxmox lab".

[windows]
ws-etw ansible_host=10.21.3.10 private_ip=10.21.3.10
# etwpy_mode not set = clone (git clone repo_url@repo_branch); there is no Vagrant mount on Proxmox.

[ubuntu]
ubuntu-trainer ansible_host=10.21.3.20 private_ip=10.21.3.20

[ubuntu:vars]
# cloud-init user + key from infrastructure/main.tf (passwordless sudo).
ansible_user=it2102
ansible_ssh_private_key_file=~/OneDrive/credentials/ssh/it2102-vms/id_rsa
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
# Who may open Grafana: the home LAN the workstation routes from.
admin_cidr=192.168.1.0/24
# Lab-only Grafana login (admin / labadmin), same as inventory.local.ini: ufw limits Grafana to admin_cidr.
grafana_admin_password=labadmin
# LLM verdict on red windows (DeepSeek). The key is saved once on the trainer: src/live/README.md §5.
live_llm_args='--llm-provider deepseek --llm-reasoning-effort none --llm-debug --llm-max-per-day 15'

[target]
# Linux endpoint (infrastructure/ ubuntu-etw): auditd -> auditship -> Loki. Playbook target.yml.
ubuntu-etw ansible_host=10.21.3.11 private_ip=10.21.3.11

[target:vars]
ansible_user=it2102
ansible_ssh_private_key_file=~/OneDrive/credentials/ssh/it2102-vms/id_rsa
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'

[attacker]
# Kali attacker (infrastructure/ kali VM) on its OWN subnet 10.21.4.0/24. Playbook kali.yml. Reach it
# over the routed path like the other VMs (add a 10.21.4.0/24 route to pve-master on the home router, or
# jump via the node: ssh -J root@<pve-master> kali@10.21.4.30). The ISO install has no cloud-init, so set
# the IP + the kali password by hand once (infrastructure/README.md "kali").
kali ansible_host=10.21.4.30 private_ip=10.21.4.30

[attacker:vars]
# Kali's PUBLIC default account (kali / kali), like the vagrant/vagrant box defaults in
# inventory.local.ini: not a secret on a lab host-only subnet, so hardcoded here (user, 2026-11-04).
# Username/password auth (not the it2102-vms key); sshpass must be on the control node.
ansible_user=kali
ansible_password=kali
ansible_become_password=kali
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'

[vpn]
# OpenVPN server (infrastructure/ nt2102-vpn). Listed so proxmox-firewall.yml can read private_ip.
nt2102-vpn ansible_host=10.21.3.50 private_ip=10.21.3.50 ansible_user=it2102 ansible_ssh_private_key_file=~/OneDrive/credentials/ssh/it2102-vms/id_rsa

[pve]
# The Proxmox host itself (proxmox-firewall.yml: router TCP 2102 -> pve-master -> DNAT nt2102-vpn:1194).
pve-master ansible_host=192.168.1.120 ansible_user=root wan_iface=vmbr0 ansible_ssh_private_key_file=~/OneDrive/credentials/ssh/proxmox/id_ed25519

[lab:children]
windows
ubuntu
target
