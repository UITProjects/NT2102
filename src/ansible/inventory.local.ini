# Local Vagrant lab. Two VMs on the host-only network 10.21.2.0/24.
#   ansible_host = control-plane (how Ansible connects): WinRM 5985 / SSH 22
#   private_ip   = data-plane (Windows shipper -> Ubuntu server). Same as ansible_host in the lab.
# Windows credentials: [windows:vars] below (public box defaults, local only). Cloud: vault. See README.md.

[windows]
ws-etw ansible_host=10.21.2.10 private_ip=10.21.2.10

[windows:vars]
# The gusztavvargadr box's default account. These are the PUBLIC box defaults, not a secret, so they
# live here for local mode only. Cloud creds never go here — they come from group_vars/vault.yml
# (passed with -e @group_vars/vault.yml --ask-vault-pass).
win_user=vagrant
win_password=vagrant

[ubuntu]
ubuntu-trainer ansible_host=10.21.2.20 private_ip=10.21.2.20

[ubuntu:vars]
# Vagrant's generated SSH key + default user. Local-only, not a secret (the key is per-VM, regenerated
# on each `vagrant up`). Cloud uses its own user/key in inventory.cloud.ini instead.
ansible_user=vagrant
ansible_ssh_private_key_file=../.vagrant/machines/ubuntu-trainer/virtualbox/private_key
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
# Grafana: who may open it (the VirtualBox host side of the host-only net) and a lab-only admin password.
admin_cidr=10.21.2.0/24
grafana_admin_password=labadmin

# Linux detection target (migration in progress): DVWA on native LAMP + Sysmon-for-Linux + Alloy.
# Ansible-managed like ubuntu-trainer, but a SEPARATE host so the clean trainer stays out of the attack
# blast radius. Its roles are gated by linux_target_enabled (default false), so it stays bare until asked.
[target]
ubuntu-target ansible_host=10.21.2.40 private_ip=10.21.2.40

[target:vars]
ansible_user=vagrant
ansible_ssh_private_key_file=../.vagrant/machines/ubuntu-target/virtualbox/private_key
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
admin_cidr=10.21.2.0/24

# The Kali attacker VM is NOT managed by Ansible: it is a local-only Vagrant box that gets the attack
# pack via a synced-folder mount (src/Vagrantfile). No [attacker] group here.

[lab:children]
windows
ubuntu
target
