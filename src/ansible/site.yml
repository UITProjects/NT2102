---
# Full lab: Windows collector/shipper/vulnlab + Ubuntu trainer + (optional) Linux target. Run all, or one
# at a time with --limit windows / --limit ubuntu / --limit target. (The Kali attacker VM is local-only and
# NOT provisioned by Ansible: it gets the attack pack via a Vagrant synced-folder mount — see src/Vagrantfile.)
#
# The Linux target (target.yml) only does anything with -e linux_target_enabled=true; otherwise it is a
# no-op, so the Windows demo is unaffected until the Linux path is verified.
- import_playbook: windows.yml
- import_playbook: ubuntu.yml
- import_playbook: target.yml
