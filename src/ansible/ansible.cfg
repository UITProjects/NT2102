[defaults]
inventory = inventory.local.ini
roles_path = roles
host_key_checking = False
retry_files_enabled = False
# Ask for the vault password interactively (group_vars/vault.yml is encrypted). Use
# `--vault-password-file` or ANSIBLE_VAULT_PASSWORD_FILE to automate.
# vault_password_file = .vault-pass
# community.general.yaml was removed (community.general 12); the builtin callback does YAML itself
stdout_callback = default
callback_result_format = yaml
interpreter_python = auto_silent

[inventory]
enable_plugins = ini
