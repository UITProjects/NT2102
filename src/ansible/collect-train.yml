---
# Move a TRAIN experiment built by 07-build-train-dataset.ps1 off the Windows VM:
#   Windows C:\lab-out\etw\experiments\<id>  -> <id>.tar.gz -> control node src/out/etw/experiments/
#   -> unpacked on the control node (EDA notebooks) and in the Ubuntu repo (training).
#
#   ansible-playbook collect-train.yml                         # newest experiment
#   ansible-playbook collect-train.yml -e collect_id=20261017T030000Z
#
# LEGACY fallback (Loki down). Normal path: `lab loop` on the trainer. collect_id = the experiment folder.

- name: Pack the experiment on Windows and fetch it to the control node
  hosts: windows
  gather_facts: false
  vars:
    exp_root: 'C:\lab-out\etw\experiments'
  tasks:
    - name: List experiment folders
      ansible.windows.win_find:
        paths: "{{ exp_root }}"
        file_type: directory
      register: exp_dirs
      when: collect_id is not defined

    - name: Pick the newest experiment (folder names are UTC timestamps, so name order = time order)
      ansible.builtin.set_fact:
        collect_id: "{{ exp_dirs.files | map(attribute='filename') | sort | last | default('') }}"
      when: collect_id is not defined

    - name: Fail if there is nothing to collect
      ansible.builtin.assert:
        that: collect_id is defined and collect_id | length > 0
        fail_msg: "no experiment folder under {{ exp_root }}; run C:\\scripts\\07-build-train-dataset.ps1 first"

    - name: Pack it with the built-in tar.exe (Compress-Archive in PS 5.1 writes backslash zip paths)
      ansible.windows.win_command: >-
        tar.exe -czf "{{ exp_root }}\{{ collect_id }}.tar.gz" -C "{{ exp_root }}" "{{ collect_id }}"
      args:
        creates: '{{ exp_root }}\{{ collect_id }}.tar.gz'

    - name: Fetch the archive to the control node
      ansible.builtin.fetch:
        src: '{{ exp_root }}\{{ collect_id }}.tar.gz'
        dest: "{{ src_dir }}/out/etw/experiments/{{ collect_id }}.tar.gz"
        flat: true

- name: Unpack on the control node
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    collect_id: "{{ hostvars[groups['windows'][0]].collect_id }}"
  tasks:
    - name: Unpack into src/out/etw/experiments
      ansible.builtin.unarchive:
        src: "{{ src_dir }}/out/etw/experiments/{{ collect_id }}.tar.gz"
        dest: "{{ src_dir }}/out/etw/experiments"
        remote_src: true
        creates: "{{ src_dir }}/out/etw/experiments/{{ collect_id }}/experiment.json"

- name: Unpack in the Ubuntu repo
  hosts: ubuntu
  gather_facts: false
  vars:
    collect_id: "{{ hostvars[groups['windows'][0]].collect_id }}"
    exp_dest: "{{ repo_dest }}/src/out/etw/experiments"
  tasks:
    - name: Ensure the experiments dir exists
      ansible.builtin.file:
        path: "{{ exp_dest }}"
        state: directory
        mode: "0755"

    - name: Copy and unpack the archive
      ansible.builtin.unarchive:
        src: "{{ src_dir }}/out/etw/experiments/{{ collect_id }}.tar.gz"
        dest: "{{ exp_dest }}"
        creates: "{{ exp_dest }}/{{ collect_id }}/experiment.json"

    - name: Next step
      ansible.builtin.debug:
        msg: >-
          {{ collect_id }} is in {{ exp_dest }}. On the trainer: `lab train --experiment {{ collect_id }} --model <name>`, then
          `lab promote <run>` and `sudo systemctl restart ocr-live`.
