# Lab teardown: undo proxmox-firewall.yml on pve-master. The Proxmox host survives `terraform destroy`, and
# /etc/iptables/rules.v4 would restore these rules on every boot, so they must be removed here.
# Everything else goes with `terraform destroy`: the Proxmox VM-level `it2102:` rules, the SDN zone/VNets
# and their SNAT, and every rule inside the VMs (ufw on the trainer, Windows firewall, nt2102-vpn iptables).
# Not covered (manual): the home router's port forward TCP 2102 -> pve-master.
# Inventory values only (proxmox.ini), so it also works after the VMs are gone. iptables-persistent stays installed.
#   ansible-playbook -i proxmox.ini proxmox-firewall-teardown.yml --check --diff   # preview
#   ansible-playbook -i proxmox.ini proxmox-firewall-teardown.yml --diff
- name: pve-master remove the NT2102 DNAT, FORWARD accepts and VPN client return route
  hosts: pve
  become: true
  gather_facts: false
  vars:
    # Must match proxmox-firewall.yml exactly: the iptables module matches a rule on every field, comment included.
    vpn_ip: "{{ hostvars['nt2102-vpn'].private_ip }}"
    vpn_client_cidr: 10.8.0.0/24
    lab_bridge: it2102
    vpn_routed_cidrs:
      - { cidr: 10.21.3.0/24, name: lab }
      - { cidr: 10.21.4.0/24, name: kali subnet }
    # Comments only our rules carry; used by the final check (the VM-level Terraform rules are not matched).
    nt2102_rule_pattern: 'it2102: DNAT OpenVPN|nt2102: VPN clients ->|-> VPN clients \(via nt2102-vpn\)'

  tasks:
    - name: Remove the DNAT rules for external port 2102 (current /tcp comment and the old /udp one)
      ansible.builtin.iptables:
        table: nat
        chain: PREROUTING
        in_interface: "{{ wan_iface }}"
        protocol: tcp
        destination_port: "2102"
        jump: DNAT
        to_destination: "{{ vpn_ip }}:1194"
        state: absent
        comment: "it2102: DNAT OpenVPN: ext 2102/{{ item }} -> {{ vpn_ip }}:1194"
      loop: [tcp, udp]
      register: vpn_dnat

    - name: Remove the forwarded VPN client -> subnet accepts
      ansible.builtin.iptables:
        chain: FORWARD
        source: "{{ vpn_client_cidr }}"
        destination: "{{ item.cidr }}"
        jump: ACCEPT
        state: absent
        comment: "nt2102: VPN clients -> {{ item.name }} (no SNAT)"
      loop: "{{ vpn_routed_cidrs }}"
      register: vpn_fwd_in

    - name: Remove the forwarded subnet -> VPN client accepts
      ansible.builtin.iptables:
        chain: FORWARD
        source: "{{ item.cidr }}"
        destination: "{{ vpn_client_cidr }}"
        jump: ACCEPT
        state: absent
        comment: "nt2102: {{ item.name }} -> VPN clients (via nt2102-vpn)"
      loop: "{{ vpn_routed_cidrs }}"
      register: vpn_fwd_out

    - name: Check the return route for VPN clients
      ansible.builtin.command: ip route show {{ vpn_client_cidr }}
      register: vpn_route
      changed_when: false
      check_mode: false            # read-only, so --check still shows whether the route would be deleted

    - name: Delete the route {{ vpn_client_cidr }} via nt2102-vpn ({{ vpn_ip }})
      ansible.builtin.command: ip route del {{ vpn_client_cidr }} via {{ vpn_ip }} dev {{ lab_bridge }}
      when: ("via " ~ vpn_ip ~ " dev " ~ lab_bridge) in vpn_route.stdout
      changed_when: true

    # Rewrites /etc/iptables/rules.v4 from the live rules, so a reboot no longer brings ours back.
    - name: Save iptables rules persistently
      ansible.builtin.command: netfilter-persistent save
      when: vpn_dnat.changed or vpn_fwd_in.changed or vpn_fwd_out.changed
      changed_when: true

    # Fail loudly if a copy of one of our rules is still there (e.g. a hand-made one with other fields).
    # grep exit codes: 0 = a match (fail), 1 = no match, 2 = file missing (nothing to restore, fine).
    - name: Check that no NT2102 rule is left in the live rules
      ansible.builtin.shell: set -o pipefail; iptables-save | grep -E '{{ nt2102_rule_pattern }}'
      args:
        executable: /bin/bash
      register: live_left
      changed_when: false
      failed_when: live_left.rc == 0
      when: not ansible_check_mode   # in --check nothing was removed, so this would always fail

    - name: Check that no NT2102 rule is left in /etc/iptables/rules.v4
      ansible.builtin.command: grep -E '{{ nt2102_rule_pattern }}' /etc/iptables/rules.v4
      register: saved_left
      changed_when: false
      failed_when: saved_left.rc == 0
      when: not ansible_check_mode
