---
# Ubuntu trainer VM: Loki + Grafana (stores the pushed logs), repo + uv sync, live server reading Loki.
- name: Configure the Ubuntu trainer VM
  hosts: ubuntu
  become: true
  gather_facts: true
  roles:
    - ubuntu_base      # apt deps, uv, firewall
    - ubuntu_loki      # Loki + Grafana (Docker, host network): receives Alloy's push
    - ubuntu_project   # git clone, uv sync, live_server systemd unit
