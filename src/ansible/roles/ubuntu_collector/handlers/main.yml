---
- name: Reconfigure sysmon
  # sysmon -c reloads the filtering config on a running service (no reinstall).
  ansible.builtin.command: sysmon -c /etc/sysmon-config.xml
  changed_when: true

- name: Restart rsyslog
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted

- name: Restart alloy
  ansible.builtin.systemd:
    name: alloy
    state: restarted

- name: Restart journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted
