---
# DVWA (Damn Vulnerable Web Application): a deliberately-vulnerable PHP app, served by XAMPP
# (Apache + PHP + MariaDB) on {{ vulnlab_port }}. It is the demo's attack target — the Kali attacker
# drives DVWA's documented OS-command-injection page (/vulnerabilities/exec/, security=low) to RCE
# while the collector captures the provenance graph (httpd.exe -> cmd.exe -> powershell). This role
# installs and serves it; it contains no exploit steps. Keep it OFF the public internet
# (subnet/host-only only). admin/password are DVWA's stock demo credentials.

- name: Install git
  chocolatey.chocolatey.win_chocolatey:
    name: git
    state: present

# XAMPP's Bitnami unattended installer HANGS when C:\xampp already exists: it re-launches, runs ~20 min
# with almost no CPU, then stalls. So skip the choco install whenever XAMPP is already on disk — this is
# idempotent and cloud-safe (a baked/snapshotted image keeps its XAMPP, and choco still has the package
# recorded). The guard only bypasses the slow installer, nothing else.
- name: Check whether XAMPP is already installed
  ansible.windows.win_stat:
    path: 'C:\xampp\apache\bin\httpd.exe'
  register: xampp_httpd

- name: Install XAMPP (Apache + PHP + MariaDB)
  chocolatey.chocolatey.win_chocolatey:
    name: "{{ xampp_package }}"
    state: present
  when: not xampp_httpd.stat.exists
  register: xampp_install

- name: Defender exclusions for XAMPP and the DVWA dir
  ansible.windows.win_powershell:
    script: |
      Add-MpPreference -ExclusionPath 'C:\xampp'
      Add-MpPreference -ExclusionPath '{{ vulnlab_dir }}'
  changed_when: false
  failed_when: false

- name: Clone DVWA
  ansible.windows.win_powershell:
    script: |
      if (-not (Test-Path '{{ vulnlab_dir }}\.git')) {
        git clone '{{ vulnlab_repo }}' '{{ vulnlab_dir }}'
        $Ansible.Changed = $true
      } else {
        $Ansible.Changed = $false
      }

# Render DVWA's config.inc.php from a COMPLETE template instead of line-editing config.inc.php.dist.
# The upstream .dist now writes each value as `getenv('X') ?: 'default'`, and surgical win_lineinfile
# edits (esp. with backrefs) corrupt those lines. win_copy compares content, so this is idempotent AND
# self-heals a previously corrupted config. `define('MYSQL',...)` must precede the SQLI_DB line (as in
# the .dist). Lab creds only; host-only network. DVWA on MariaDB needs a dedicated user (see schema task).
- name: Render DVWA config.inc.php
  ansible.windows.win_copy:
    dest: "{{ vulnlab_dir }}\\config\\config.inc.php"
    content: |
      <?php
      # Rendered by Ansible (win_vulnlab) for the local, host-only detection lab.
      # $DBMS is required (dvwaPage.inc.php reads it); without it setup.php never runs the create path.
      $DBMS = 'MySQL';
      $_DVWA = array();
      $_DVWA[ 'db_server' ]   = '127.0.0.1';
      $_DVWA[ 'db_database' ] = '{{ dvwa_db_name }}';
      $_DVWA[ 'db_user' ]     = '{{ dvwa_db_user }}';
      $_DVWA[ 'db_password' ] = '{{ dvwa_db_password }}';
      $_DVWA[ 'db_port']      = '3306';
      $_DVWA[ 'recaptcha_public_key' ]  = '';
      $_DVWA[ 'recaptcha_private_key' ] = '';
      $_DVWA[ 'default_security_level' ] = 'low';
      $_DVWA[ 'default_locale' ] = 'en';
      $_DVWA[ 'disable_authentication' ] = false;
      define( 'MYSQL', 'mysql' );
      define( 'SQLITE', 'sqlite' );
      $_DVWA[ 'SQLI_DB' ] = MYSQL;
      ?>

# Serve DVWA at the Apache DocumentRoot so the exploit path stays /vulnerabilities/exec/ (no /DVWA
# prefix), and move Apache off 80 onto {{ vulnlab_port }}. backrefs -> acts only on the stock lines.
- name: Point Apache at DVWA and onto {{ vulnlab_port }}
  community.windows.win_lineinfile:
    path: 'C:\xampp\apache\conf\httpd.conf'
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    backrefs: true
  # Apache on Windows normalises paths to forward slashes, and this XAMPP writes the htdocs block as
  # "/xampp/htdocs" (drive-relative, no "C:"). So match that exact form and write the DVWA path with
  # forward slashes — otherwise the <Directory> block is never repointed, the DVWA dir inherits the
  # default <Directory /> "Require all denied", and every request is 403 (AH01630).
  loop:
    - { regexp: '^\s*Listen\s+\d+\s*$', line: "Listen {{ vulnlab_port }}" }
    - { regexp: '^\s*DocumentRoot\s+".*"', line: 'DocumentRoot "{{ vulnlab_dir | replace(''\\'', ''/'') }}"' }
    - { regexp: '^\s*<Directory\s+"(?:C:)?/xampp/htdocs">', line: '<Directory "{{ vulnlab_dir | replace(''\\'', ''/'') }}">' }
  register: httpd_conf

# Install Apache + MariaDB as Windows services so both come up on boot (replaces a scheduled task).
# The XAMPP service installers are idempotent-ish but noisy; guard on Get-Service so a 2nd run no-ops.
- name: Install Apache + MariaDB as services
  ansible.windows.win_powershell:
    script: |
      $changed = $false
      if (-not (Get-Service 'Apache2.4' -ErrorAction SilentlyContinue)) {
        & 'C:\xampp\apache\bin\httpd.exe' -k install | Out-Null
        $changed = $true
      }
      if (-not (Get-Service 'mysql' -ErrorAction SilentlyContinue)) {
        & 'C:\xampp\mysql\bin\mysqld.exe' --install mysql | Out-Null
        $changed = $true
      }
      $Ansible.Changed = $changed
  register: svc_install

- name: Start + enable Apache and MariaDB
  ansible.windows.win_service:
    name: "{{ item }}"
    state: "{{ 'restarted' if (httpd_conf is changed or svc_install is changed) else 'started' }}"
    start_mode: auto
  loop:
    - mysql
    - Apache2.4

# DVWA has no SQL dump — it builds its tables (incl. the users table admin/password logs into) only
# when setup.php is POSTed. Do it once: create the schema, then drive setup.php with its CSRF token.
# Idempotent: skip entirely once the users table exists.
- name: Create the DVWA schema + run setup.php (once)
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $mysql = 'C:\xampp\mysql\bin\mysql.exe'
      $exists = (& $mysql -uroot -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='{{ dvwa_db_name }}' AND table_name='users';") 2>$null
      if ("$exists".Trim() -eq '1') { $Ansible.Changed = $false; return }

      # DVWA on MariaDB cannot use root (its README): create the db + a dedicated '{{ dvwa_db_user }}'
      # user that config.inc.php connects as, so setup.php can build the schema. Done as root via the CLI.
      # One -e with ;-separated statements (a PowerShell here-string would break under YAML indentation).
      $ddl = "CREATE DATABASE IF NOT EXISTS {{ dvwa_db_name }}; " +
             "CREATE USER IF NOT EXISTS '{{ dvwa_db_user }}'@'localhost' IDENTIFIED BY '{{ dvwa_db_password }}'; " +
             "CREATE USER IF NOT EXISTS '{{ dvwa_db_user }}'@'127.0.0.1' IDENTIFIED BY '{{ dvwa_db_password }}'; " +
             "GRANT ALL PRIVILEGES ON {{ dvwa_db_name }}.* TO '{{ dvwa_db_user }}'@'localhost'; " +
             "GRANT ALL PRIVILEGES ON {{ dvwa_db_name }}.* TO '{{ dvwa_db_user }}'@'127.0.0.1'; FLUSH PRIVILEGES;"
      & $mysql -uroot -e $ddl
      if ($LASTEXITCODE -ne 0) { throw "MariaDB db/user setup failed (rc=$LASTEXITCODE)" }

      $base = "http://127.0.0.1:{{ vulnlab_port }}"
      $s = $null
      # setup.php's create button carries a CSRF user_token; scrape it, then POST with the session cookie.
      $page = Invoke-WebRequest "$base/setup.php" -UseBasicParsing -SessionVariable s
      $m = [regex]::Match($page.Content, "name='user_token'\s+value='([0-9a-f]+)'")
      $token = if ($m.Success) { $m.Groups[1].Value } else { '' }
      Invoke-WebRequest "$base/setup.php" -UseBasicParsing -WebSession $s -Method POST `
        -Body @{ create_db = 'Create / Reset Database'; user_token = $token } | Out-Null

      $exists = (& $mysql -uroot -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='{{ dvwa_db_name }}' AND table_name='users';") 2>$null
      if ("$exists".Trim() -ne '1') { throw "DVWA setup.php did not create the users table" }
      $Ansible.Changed = $true

- name: Allow the vulnlab port through the firewall (subnet/host-only only)
  community.windows.win_firewall_rule:
    name: "dvwa {{ vulnlab_port }}"
    localport: "{{ vulnlab_port }}"
    action: allow
    direction: in
    protocol: tcp
    # Host-only networks have no gateway/DNS, so Windows classifies the NIC as Public, not Private.
    # Open both profiles so reachability does not depend on that classification; the lab stays
    # host-only via the subnet, so this does not widen exposure.
    profiles: [private, public]
    state: present
    enabled: true
