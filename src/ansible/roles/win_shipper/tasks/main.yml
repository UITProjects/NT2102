---
# Deploy ship-live.ps1: start a live SilkETW capture and stream it to the Ubuntu live server.
# The server address is baked in from trainer_host/server_port (no hardcoded IP). Run it interactively
# during the demo (elevated PowerShell), alongside the benign workload.

- name: Deploy ship-live.ps1
  ansible.windows.win_template:
    src: ship-live.ps1.j2
    dest: 'C:\scripts\ship-live.ps1'
