---
# auditd on the Linux endpoint (ubuntu-etw): what the kernel records. auditship (next role) ships it to Loki.
# The auditship user is created HERE because the rules must exclude its uid (feedback loop, DEVIATIONS D11).

- name: auditship system user (runs the shipper; its own syscalls are excluded from auditing)
  ansible.builtin.user:
    name: "{{ auditship_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    home: "{{ auditship_state_dir }}"
  register: auditship_account

- name: Install auditd
  ansible.builtin.apt:
    name: auditd
    state: present
    update_cache: true
    cache_valid_time: 3600

# log_group: auditd creates audit.log as 0640 root:<group>, so the shipper reads it without root.
- name: auditd.conf settings (log group, rotation)
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^\s*{{ item.key }}\s*='
    line: "{{ item.key }} = {{ item.value }}"
  loop: "{{ auditd_conf | dict2items }}"
  notify: restart auditd

- name: Audit rules (exclude the shipper, then exec / net / file watches)
  ansible.builtin.template:
    src: nt2102.rules.j2
    dest: /etc/audit/rules.d/50-nt2102.rules
    mode: "0640"
  notify: load audit rules

- name: auditd enabled and running
  ansible.builtin.systemd:
    name: auditd
    enabled: true
    state: started
