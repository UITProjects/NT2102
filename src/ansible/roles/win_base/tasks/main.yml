---
# Base OS configuration for the collector VM (native rewrite of scripts/01-base.ps1). Idempotent.

- name: Set the lab (private_ip) network adapter to the Private profile
  # Public profile restricts the WinRM/RDP firewall rules; the host-only/subnet NIC must be Private.
  # Only call Set-NetConnectionProfile when needed: it can block past the WinRM read timeout (the play
  # then fails as UNREACHABLE) when run on the NIC WinRM itself uses, e.g. shortly after boot.
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false
      $ip = Get-NetIPAddress -IPAddress '{{ private_ip }}' -ErrorAction SilentlyContinue
      # Not fatal on cloud where the subnet NIC may already be Private / differently named.
      if ($ip) {
        $p = Get-NetConnectionProfile -InterfaceIndex $ip.InterfaceIndex -ErrorAction SilentlyContinue
        if ($p -and $p.NetworkCategory -ne 'Private') {
          Set-NetConnectionProfile -InterfaceIndex $ip.InterfaceIndex -NetworkCategory Private
          $Ansible.Changed = $true
        }
      }

- name: Time zone = UTC+7 ({{ tz_windows }})
  # ETW TimeStamps carry their offset and labels use UTC, so the zone does not shift epoch ms.
  ansible.windows.win_timezone:
    timezone: "{{ tz_windows }}"

- name: Resync the clock
  ansible.windows.win_command: w32tm /resync /force
  register: w32tm
  changed_when: false
  failed_when: false

- name: Never sleep during a capture
  ansible.windows.win_command: "{{ item }}"
  loop:
    - powercfg /change standby-timeout-ac 0
    - powercfg /change monitor-timeout-ac 0
    - powercfg /hibernate off
  changed_when: false

- name: Enable Remote Desktop (registry)
  ansible.windows.win_regedit:
    path: HKLM:\System\CurrentControlSet\Control\Terminal Server
    name: fDenyTSConnections
    data: 0
    type: dword

- name: Allow Remote Desktop through the firewall
  ansible.windows.win_powershell:
    script: Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
  changed_when: false

- name: Lab folders
  ansible.windows.win_file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ tools_dir }}"
    - "{{ lab_home }}"
    - "{{ out_dir }}"
    - "{{ raw_root }}"
    - 'C:\lab-labels'
    - 'C:\lab-labels\benign'
    - 'C:\scripts'
    - 'C:\lab'

- name: Freeze Windows Update so captures stay comparable
  ansible.windows.win_service:
    name: wuauserv
    state: stopped
    start_mode: disabled
  failed_when: false

- name: Defender exclusions for the lab folders
  # Attack tooling and the vulnlab live under these paths; excluded so they are not quarantined.
  ansible.windows.win_powershell:
    script: |
      Add-MpPreference -ExclusionPath '{{ tools_dir }}','C:\lab','C:\lab-out','{{ lab_home }}'
      $Ansible.Changed = $true
  changed_when: false
  failed_when: false

- name: Turn Defender real-time monitoring off
  # With Tamper Protection ON this is silently ignored. Turn TP off in the Windows Security GUI once
  # (see README "Tamper Protection"), then re-run this role.
  ansible.windows.win_powershell:
    script: |
      Set-MpPreference -DisableRealtimeMonitoring $true
      $s = Get-MpComputerStatus
      $Ansible.Result = @{ realtime = $s.RealTimeProtectionEnabled; tamper = $s.IsTamperProtected }
  register: defender
  changed_when: false
  failed_when: false

- name: Warn if real-time protection is still on (Tamper Protection likely still enabled)
  ansible.builtin.debug:
    msg: >-
      Defender real-time protection is still ON (IsTamperProtected={{ defender.result.tamper | default('?') }}).
      Turn OFF Tamper Protection in the Windows Security GUI, then re-run this role.
  when: defender.result is defined and defender.result.realtime | default(false)
