---
# Deploy the scripted benign workload (06) and the training-dataset orchestrator (07).
# 06 launches user apps THROUGH explorer.exe so the provenance graph does not learn PowerShell as the
# benign parent (CLAUDE §9). Both must run INTERACTIVELY in the RDP desktop session, not over WinRM:
#   C:\scripts\06-benign-workload.ps1 -SelfTest                 # once per VM
#   C:\scripts\07-build-train-dataset.ps1                       # new TRAIN experiment (capture + 06 + windows)
#   C:\scripts\06-benign-workload.ps1 -DurationMinutes 20       # during the demo, next to ship-live.ps1
# 07 finds 06 via $PSScriptRoot, so both live in C:\scripts. Afterwards: ansible-playbook collect-train.yml

- name: Deploy the benign workload generator
  ansible.windows.win_copy:
    src: "{{ src_dir }}/scripts/06-benign-workload.ps1"
    dest: 'C:\scripts\06-benign-workload.ps1'

- name: Deploy the training-dataset orchestrator
  ansible.windows.win_copy:
    src: "{{ src_dir }}/scripts/07-build-train-dataset.ps1"
    dest: 'C:\scripts\07-build-train-dataset.ps1'
