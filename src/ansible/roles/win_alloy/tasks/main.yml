---
# Grafana Alloy, native Windows install (no Docker on the VM): tails SilkETW's raw files and pushes every
# line to Loki on the trainer ({{ loki_url }}). Replaces the HTTP shipper as the data path.
# Installer: the release's alloy-installer-windows-amd64.exe, silent (/S). It registers the "Alloy" service
# (LocalSystem, automatic) with the config at C:\Program Files\GrafanaLabs\Alloy\config.alloy.

- name: Download Alloy {{ alloy_version }}
  ansible.windows.win_get_url:
    url: "{{ alloy_url }}"
    dest: "{{ tools_dir }}\\alloy-installer-{{ alloy_version }}.exe"
    checksum: "{{ alloy_sha256 | regex_replace('^sha256:', '') or omit }}"
    checksum_algorithm: sha256
    force: false   # version-pinned URL: do not re-download each run (idempotent)

- name: Installed Alloy version
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false
      $exe = Join-Path $env:ProgramFiles 'GrafanaLabs\Alloy\alloy-windows-amd64.exe'
      if (Test-Path $exe) { (& $exe --version | Out-String).Trim() } else { '' }
  register: alloy_installed
  changed_when: false

- name: Install Alloy silently (only when missing or another version)
  ansible.windows.win_command: >-
    "{{ tools_dir }}\alloy-installer-{{ alloy_version }}.exe" /S /DISABLEREPORTING=yes
  when: alloy_version not in (alloy_installed.output | join(' '))

- name: Defender exclusion for Alloy (it reads every raw line; do not scan it)
  ansible.windows.win_powershell:
    script: |
      Add-MpPreference -ExclusionPath "$env:ProgramFiles\GrafanaLabs\Alloy","$env:ProgramData\GrafanaLabs\Alloy"
      $Ansible.Changed = $false
  failed_when: false

- name: Alloy config (SilkETW + dos map + ledger -> Loki)
  ansible.windows.win_template:
    src: config.alloy.j2
    dest: 'C:\Program Files\GrafanaLabs\Alloy\config.alloy'
    newline_sequence: "\n"
  notify: Restart Alloy

- name: Validate the config with Alloy itself
  ansible.windows.win_command: >-
    "C:\Program Files\GrafanaLabs\Alloy\alloy-windows-amd64.exe" fmt "C:\Program Files\GrafanaLabs\Alloy\config.alloy"
  changed_when: false

# collector=python (default): etwcollect pushes to Loki itself, so Alloy is stopped AND disabled (a reboot must not
# bring it back to double-ship). collector=silketw: the old path, Alloy automatic and running. This whole role
# is removed once etwcollect is verified (DEVIATIONS D10).
- name: Alloy service (running only for collector=silketw)
  ansible.windows.win_service:
    name: Alloy
    start_mode: "{{ 'auto' if collector == 'silketw' else 'disabled' }}"
    state: "{{ 'started' if collector == 'silketw' else 'stopped' }}"

- name: Restart now if the config changed (so the check below sees the new pipeline)
  ansible.builtin.meta: flush_handlers

# Loki is Alloy's push target but NOT required to provision the collector — this is a soft check only
# (failed_when: false). Keep it FAST: a short per-request timeout + few retries so an off/aborted trainer
# (or one still replaying its WAL right after boot) degrades to a quick warning in ~15s, not ~4 minutes of
# win_uri connection timeouts. Logs still ship once the trainer is up; this task does not gate anything.
- name: Loki reachable from this VM (Alloy's push target)
  ansible.windows.win_uri:
    url: "{{ loki_url }}/ready"
    return_content: true
    timeout: 4          # cap each attempt; an unreachable host otherwise hangs on the default 30s
  register: loki_from_vm
  until: loki_from_vm.status_code == 200
  retries: 3            # brief tolerance for a just-booted Loki; not a hard wait (it is only a warning)
  delay: 2
  failed_when: false

- name: Report Loki reachability
  ansible.builtin.debug:
    msg: >-
      {{ 'Loki ready at ' ~ loki_url if (loki_from_vm.status_code | default(0)) == 200 else
         'WARNING: Loki not reachable at ' ~ loki_url ~ ' - the Ubuntu trainer is likely off; start it with '
         ~ '`vagrant up ubuntu-trainer` (or provision it: site.yml --limit ubuntu). Collector still installs fine.' }}
