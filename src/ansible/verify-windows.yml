---
# Read-only verification that every collector tool is installed on ws-etw (incl. DVWA).
# Safe + idempotent (no changes): run on demand, NOT part of site.yml.
#   ansible-playbook -i inventory.local.ini verify-windows.yml -e vulnlab_enabled=true
# Each assert names the tool and the role that installs it, so a failure points straight at the fix.
- name: Verify Windows collector tools
  hosts: windows
  gather_facts: false
  tasks:

    # ---------- win_collector ----------
    - name: Old collector removed (SilkService + Alloy, replaced by etwcollect)
      ansible.windows.win_service_info:
        name: "{{ item }}"
      loop: [SilkService, Alloy]
      register: old_svcs
    - ansible.builtin.assert:
        that: (old_svcs.results | map(attribute='services') | sum(start=[]) | length) == 0
        fail_msg: "SilkService or Alloy is still installed — run role win_collector (it removes them)"
        success_msg: "SilkService and Alloy are gone"

    - name: Collector files present (win_collector)
      ansible.windows.win_stat:
        path: "{{ item }}"
      loop:
        - "{{ lab_home }}\\etw2nodlink.py"
        - "{{ lab_home }}\\etwwindow.py"
        - "{{ lab_home }}\\etwship.py"
        - "{{ lab_home }}\\etwctl.ps1"
        - "{{ tools_dir }}\\etwctl.cmd"
        - "{{ tools_dir }}\\python-embed\\{{ python_embed_version }}\\python.exe"
      register: collector_files
    - ansible.builtin.assert:
        that: collector_files.results | map(attribute='stat.exists') | min
        fail_msg: "A collector file is missing — run role win_collector"
        success_msg: "Converter, windowing, shipper, etwctl and embeddable Python all present"

    - name: etw-python collector present (win_collector)
      ansible.windows.win_stat:
        path: "{{ item }}"
      loop:
        - "{{ uv_dir }}\\{{ uv_version }}\\uv.exe"
        - "{{ etwpy_python }}"
        - "{{ etwpy_src | default(etwpy_clone_dir ~ '\\src\\etw-python') }}\\pyproject.toml"
      register: etwpy_files
    - ansible.builtin.assert:
        that: etwpy_files.results | map(attribute='stat.exists') | min
        fail_msg: "uv, the collector venv or its source is missing — run role win_collector (mount mode: vagrant reload ws-etw)"
        success_msg: "uv, collector venv and source present"

    - name: Collector task registered (win_collector)
      ansible.windows.win_powershell:
        script: |
          $Ansible.Changed = $false
          $t = Get-ScheduledTask -TaskName '{{ collector_task }}' -ErrorAction SilentlyContinue
          if ($t) { "$($t.State)|$($t.Principal.UserId)|$($t.Actions[0].Execute)" } else { 'missing' }
      register: coll_task
    - ansible.builtin.assert:
        that: coll_task.output[0] != 'missing'
        fail_msg: "task {{ collector_task }} not registered — run role win_collector"
        success_msg: "task {{ collector_task }}: {{ coll_task.output[0] }}"

    - name: Collector selftest (proves it runs; not that it captures)
      ansible.windows.win_command: '"{{ etwpy_python }}" -m etwcollect selftest'
      environment:
        ETW2NODLINK: "{{ lab_home }}\\etw2nodlink.py"
      changed_when: false

    - name: Converter selftest (proves it runs)
      ansible.windows.win_command: >-
        "{{ tools_dir }}\python-embed\{{ python_embed_version }}\python.exe" "{{ lab_home }}\etw2nodlink.py" --selftest
      changed_when: false

    # ---------- win_shipper ----------
    - name: Shipper script present (win_shipper)
      ansible.windows.win_stat:
        path: 'C:\scripts\start-live.ps1'
      register: shipper_stat
    - ansible.builtin.assert:
        that: shipper_stat.stat.exists
        fail_msg: "start-live.ps1 missing — run role win_shipper"
        success_msg: "start-live.ps1 present (always-on live capture)"

    # ---------- win_vulnlab / DVWA (only when enabled) ----------
    - name: DVWA checks (win_vulnlab)
      when: vulnlab_enabled | bool
      block:
        - name: Apache + MariaDB services running
          ansible.windows.win_service_info:
            name: "{{ item }}"
          loop:
            - Apache2.4
            - mysql
          register: dvwa_svcs

        - name: DVWA cloned + configured
          ansible.windows.win_stat:
            path: "{{ item }}"
          loop:
            - "{{ vulnlab_dir }}\\vulnerabilities\\exec\\index.php"
            - "{{ vulnlab_dir }}\\config\\config.inc.php"
          register: dvwa_files

        - name: DVWA login page serving on {{ vulnlab_port }}
          ansible.windows.win_uri:
            url: "http://localhost:{{ vulnlab_port }}/login.php"
            method: GET
            status_code: [200, 302]
          register: dvwa_http
          failed_when: false

        - ansible.builtin.assert:
            that:
              # flatten the per-service results into one list, then count the ones in state 'started'
              - (dvwa_svcs.results | map(attribute='services') | sum(start=[]) | selectattr('state', 'equalto', 'started') | list | length) == 2
              - dvwa_files.results | map(attribute='stat.exists') | min
              - (dvwa_http.status_code | default(0)) in [200, 302]
            fail_msg: >-
              DVWA not fully up — services started={{ dvwa_svcs.results | map(attribute='services') | sum(start=[]) | selectattr('state', 'equalto', 'started') | list | length }}/2,
              files present={{ dvwa_files.results | map(attribute='stat.exists') | list }},
              http={{ dvwa_http.status_code | default('no response') }}. Run role win_vulnlab (-e vulnlab_enabled=true).
            success_msg: "DVWA served by XAMPP on {{ vulnlab_port }} (Apache + MariaDB up, login page reachable)"

    - name: Verification summary
      ansible.builtin.debug:
        msg: "ALL TOOLS VERIFIED on {{ inventory_hostname }} (DVWA checked = {{ vulnlab_enabled | bool }})"
