[project]
name = "nt2102"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "jupyter>=1.1.1",
    "networkx>=3.7",
    "pandas>=3.0.6",
    "pytz>=2026.4",
    "questionary>=2.1.1",
    "torch>=2.14.1",
    "torch-geometric>=2.8.0.post1",
    "uvicorn>=0.54.0",
]

# `lab` command (src/lab/cli.py): `uv sync`, then `source .venv/bin/activate` puts it on PATH.
[project.scripts]
lab = "lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab"]   # only the CLI is packaged; pipeline/ and live/ stay plain scripts

[tool.uv]
package = true

[dependency-groups]
llm = [
    "anthropic>=1.13.0",
    "openai>=3.29.0",
]
