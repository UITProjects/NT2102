# main   -> ghcr.io/uitprojects/nt2102-demo:sha-<short>, :edge
# vX.Y.Z -> ghcr.io/uitprojects/nt2102-demo:X.Y.Z, :latest
# Make the GHCR package public once; the cluster pulls without a secret.
name: demo-image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'src/live/**'
      - 'src/pipeline/alg1.py'
      - 'src/pipeline/alg2.py'
      - 'src/pipeline/cmdlines.py'
      - 'deploy/**'
      - '.dockerignore'
      - '.github/workflows/demo-image.yml'
  pull_request:
    paths:
      - 'src/live/**'
      - 'deploy/**'
      - '.github/workflows/demo-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: demo-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/uitprojects/nt2102-demo

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install --require-hashes -r deploy/docker/requirements.txt
          pip install httpx==0.28.1   # fastapi.testclient only
      - name: selftests (snapshot path)
        run: |
          for t in repository file_store snapshot playback; do python src/live/$t.py --selftest; done
          python -c "import sys; sys.path.insert(0, 'src/live'); import live_server; live_server.selftest_snapshot()"

  image:
    needs: selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-,format=short
            type=raw,value=edge,enable={{is_default_branch}}
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: NT2102_CODE_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test the built image
        if: github.event_name != 'pull_request'
        run: |
          ref=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker run -d --name demo -p 8000:8000 --read-only --tmpfs /data --tmpfs /tmp --memory 256m "$ref"
          for i in $(seq 1 30); do curl -sf localhost:8000/healthz && break; sleep 1; done
          curl -sf localhost:8000/api/status | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['snapshot']['counts']['windows'] > 0, d"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/ingest -d '{}')" = 403
