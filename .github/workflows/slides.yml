# Build the Slidev deck in presentation/ and publish it to GitHub Pages.
# PRs: build only (catches broken slides). Push to main / manual run: build + deploy.
name: Slides → GitHub Pages

on:
  push:
    branches: [main]
    paths: ['presentation/**', '.github/workflows/slides.yml']
  pull_request:
    paths: ['presentation/**', '.github/workflows/slides.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: presentation
    env:
      # playwright-chromium is only needed for `slidev export`, not for the web build
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4   # submodules (OCR-APT/, dataset/) are not fetched by default
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: presentation/package-lock.json
      - run: npm ci
      # project site lives under /<repo>/, so assets need that base path
      - run: npx slidev build --base /${{ github.event.repository.name }}/
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: presentation/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
